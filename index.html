<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kwentoink</title>
<meta name="theme-color" content="#cfe8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kwentoink">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<style>
/* ================= KWENTOINK STYLES ================= */
:root{
  --sky:#cfe8fb; --sky2:#e9f5fe; --cream:#fff8ee; --navy:#2c3e6b; --navy2:#4d6699;
  --pink:#ef6f8a; --rose:#ffe1e7; --green:#dff5e3; --green2:#2f8f5b; --peach:#ffe9d6;
  --yellow:#ffd66b; --muted:#7686a6; --line:#e3eefa; --white:#fff;
  --r:22px; --shadow:0 3px 0 rgba(44,62,107,.07), 0 8px 24px rgba(44,62,107,.06);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safeb: env(safe-area-inset-bottom, 0px); --safet: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--sky);color:var(--navy);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--navy)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.b{font-weight:800}

/* ---- layout ---- */
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + var(--safeb))}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--sky) 80%,rgba(207,232,251,0));padding:calc(10px + var(--safet)) 16px 8px;display:flex;align-items:center;gap:10px}
.top img{width:40px;height:40px;border-radius:12px}
.brand{font-weight:900;font-size:21px;letter-spacing:.5px;line-height:1}
.brand span{color:var(--pink)}
.bizname{font-size:12px;color:var(--muted);font-weight:700;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top .tb{min-width:0;flex:1 1 auto;overflow:hidden}
.top .tb .brand{white-space:nowrap}
.top>*{flex-shrink:0}.top .tb{flex-shrink:1}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--white);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow)}
.sync{font-size:11px;font-weight:800;padding:6px 10px;max-width:112px;overflow:hidden;text-overflow:ellipsis;border-radius:99px;background:var(--white);box-shadow:var(--shadow);white-space:nowrap}
.sync.ok{color:var(--green2)} .sync.wait{color:#b7791f} .sync.off{color:var(--muted)}
.demo-chip{font-size:10px;background:var(--yellow);padding:2px 7px;border-radius:99px;font-weight:900;margin-left:4px}

.view{padding:4px 16px 16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:10px 2px 12px;font-weight:900}
h3{font-size:16px;margin:18px 2px 10px;font-weight:900}
.card{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}

/* ---- hello bubble ---- */
.hello{display:flex;align-items:flex-end;gap:8px;margin:2px 0 12px}
.hello .m{width:78px;flex:none}
.bubble{background:var(--white);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:var(--shadow);font-weight:700;font-size:15px;line-height:1.35;position:relative}
.bubble small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}

/* ---- period chips ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--white);font-weight:800;font-size:14px;box-shadow:var(--shadow);border:2px solid transparent;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff}
.chip.sel{border-color:var(--navy);background:var(--sky2)}

/* ---- dashboard cards ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-height:108px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.stat .lbl{font-weight:900;font-size:14px;display:flex;align-items:center;gap:6px}
.stat .amt{font-weight:900;font-size:22px;letter-spacing:-.3px;margin-top:8px;word-break:break-all}
.stat .sub{font-size:12px;font-weight:700;color:var(--muted)}
.stat .em{position:absolute;right:10px;top:8px;font-size:30px;opacity:.9}
.s-in{background:var(--green)} .s-out{background:var(--peach)} .s-profit{background:var(--white)} .s-owed{background:var(--rose)} .s-owe{background:#efe9ff}
.big{grid-column:1/-1}
.cashbox{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin:12px 0}
.cashbox .amt{font-size:24px;font-weight:900}
.cashbox .lbl{font-size:13px;opacity:.8;font-weight:700}

/* ---- list ---- */
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.item .ic.in{background:var(--green)} .item .ic.out{background:var(--peach)}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:900;white-space:nowrap}
.val.in{color:var(--green2)} .val.out{color:var(--pink)}
.dayhead{display:flex;justify-content:space-between;font-weight:900;font-size:13px;color:var(--muted);margin:16px 6px 6px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-weight:700}
.empty .m{width:110px;margin:0 auto 8px}
.search{width:100%;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:var(--white);margin-bottom:10px}

/* ---- bottom nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:520px;background:var(--white);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(44,62,107,.10);display:flex;align-items:flex-end;justify-content:space-around;padding:8px 6px calc(8px + var(--safeb))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.nav button .e{font-size:22px;filter:grayscale(.6);opacity:.75}
.nav button.on{color:var(--navy)} .nav button.on .e{filter:none;opacity:1}
.fab{width:64px!important;height:64px;flex:none!important;border-radius:22px;background:var(--pink)!important;color:#fff!important;font-size:34px!important;font-weight:900;display:grid!important;place-items:center;margin-top:-30px;box-shadow:0 8px 18px rgba(239,111,138,.45)}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;background:rgba(30,42,74,.45);z-index:60;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:520px;background:var(--cream);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;padding:10px 16px calc(20px + var(--safeb));transform:translateY(100%);transition:transform .25s ease;-webkit-overflow-scrolling:touch}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#d9cdbb;margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h2{margin:0}
.x{width:40px;height:40px;border-radius:14px;background:var(--white);font-size:20px;font-weight:900;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--white);border-radius:18px;padding:5px;gap:5px;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{flex:1;padding:12px 6px;border-radius:14px;font-weight:900;font-size:15px}
.seg button.on.in{background:var(--green);color:var(--green2)}
.seg button.on.out{background:var(--peach);color:#c0563a}
.seg button.on.n{background:var(--navy);color:#fff}
.amtwrap{background:var(--white);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.amtwrap span{font-size:28px;font-weight:900;color:var(--muted)}
.amtwrap input{border:0;outline:0;font-size:34px;font-weight:900;width:100%;background:transparent;min-width:0}
.field{margin-bottom:12px}
.field label{display:block;font-weight:800;font-size:13px;margin:0 4px 6px;color:var(--navy2)}
.inp{width:100%;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--white);outline:0}
.inp:focus{border-color:#9cc5ee}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.cat{padding:9px 12px;border-radius:14px;background:var(--white);font-weight:800;font-size:14px;border:2px solid transparent;box-shadow:var(--shadow)}
.cat.sel{border-color:var(--navy);background:var(--sky2)}
.rcpt{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:18px;padding:12px;box-shadow:var(--shadow);border:2px dashed #c9dcf2}
.rcpt img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.rcpt .ph{width:64px;height:64px;border-radius:12px;background:var(--sky2);display:grid;place-items:center;font-size:28px;flex:none}
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-weight:900;font-size:17px;text-align:center;box-shadow:var(--shadow)}
.btn.main{background:var(--navy);color:#fff}
.btn.pink{background:var(--pink);color:#fff}
.btn.soft{background:var(--white);color:var(--navy)}
.btn.danger{background:var(--white);color:var(--pink)}
.btn:active,.chip:active,.cat:active,.iconbtn:active{transform:scale(.97)}
.row2{display:flex;gap:10px}.row2>*{flex:1}

/* ---- full screens (wizard, install, gates) ---- */
.screen{position:fixed;inset:0;z-index:80;background:var(--sky);overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:calc(18px + var(--safet)) 18px calc(18px + var(--safeb))}
.screen .inner{width:100%;max-width:460px;display:flex;flex-direction:column;flex:1}
.wz-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:#fff;opacity:.8}
.dots i.on{background:var(--navy);width:22px}
.wz-m{width:150px;margin:8px auto 0}
.wz-q{background:var(--white);border-radius:24px;padding:16px 18px;box-shadow:var(--shadow);font-weight:900;font-size:20px;line-height:1.3;text-align:center;margin:10px 0 16px;position:relative}
.wz-q:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--white)}
.wz-q small{display:block;font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
.opts{display:grid;gap:10px}
.opt{background:var(--white);border-radius:20px;padding:15px 16px;font-weight:900;font-size:17px;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);border:3px solid transparent}
.opt .e{font-size:28px}
.opt.sel{border-color:var(--navy);background:var(--sky2)}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.wz-foot{margin-top:auto;padding-top:16px;display:flex;gap:10px}
.wz-input{width:100%;padding:16px;border-radius:20px;border:3px solid var(--white);background:var(--white);font-size:20px;font-weight:800;text-align:center;outline:0;box-shadow:var(--shadow)}
.wz-input:focus{border-color:#9cc5ee}

/* ---- install guide ---- */
.inst-step{display:flex;gap:12px;align-items:flex-start;background:var(--white);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;font-weight:700;line-height:1.35}
.inst-step .n{width:30px;height:30px;border-radius:10px;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.kbd{display:inline-flex;align-items:center;gap:4px;background:var(--sky2);border-radius:8px;padding:1px 7px;font-weight:900;white-space:nowrap}
.pointer{position:fixed;z-index:90;font-size:54px;animation:bounce 1s infinite;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.pointer.bc{bottom:calc(6px + var(--safeb));left:50%;margin-left:-27px}
.pointer.br{bottom:calc(6px + var(--safeb));right:14px}
.pointer.tr{top:calc(4px + var(--safet));right:10px;animation-name:bounceUp}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes bounceUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---- coach / tour ---- */
.blk{position:fixed;z-index:100;background:transparent}
.ring{position:fixed;z-index:101;border-radius:18px;box-shadow:0 0 0 4px var(--yellow),0 0 0 9999px rgba(20,30,60,.62);pointer-events:none;transition:all .25s ease}
.coach{position:fixed;z-index:102;left:16px;right:16px;margin:0 auto;max-width:420px;background:var(--white);border-radius:22px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;transition:top .25s ease}
.coach .m{width:58px;flex:none}
.coach .txt{font-weight:800;line-height:1.35;font-size:15px}
.coach .act{display:flex;gap:8px;margin-top:10px;align-items:center}
.coach .act .go{background:var(--navy);color:#fff;border-radius:12px;padding:9px 16px;font-weight:900}
.coach .act .skip{font-size:12px;color:var(--muted);font-weight:800;margin-left:auto}
.coach .stepn{font-size:11px;color:var(--muted);font-weight:800}
.tap-arrow{position:fixed;z-index:103;font-size:40px;pointer-events:none;animation:bounce 0.9s infinite}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:calc(104px + var(--safeb));transform:translateX(-50%) translateY(20px);z-index:120;background:var(--white);border-radius:20px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(44,62,107,.25);font-weight:900;opacity:0;transition:all .25s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .m{width:46px}

/* ---- reports ---- */
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bar i{display:block;border-radius:5px 5px 2px 2px;min-height:2px}
.bar i.in{background:#7fd19a}.bar i.out{background:#ffb39a}
.barlbl{display:flex;gap:3px;font-size:9px;color:var(--muted);font-weight:800}
.barlbl span{flex:1;text-align:center}
.hbar{margin:10px 0}
.hbar .h{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:4px}
.hbar .track{height:12px;border-radius:9px;background:var(--sky2);overflow:hidden}
.hbar .fill{height:100%;border-radius:9px}
.legend{display:flex;gap:12px;font-size:12px;font-weight:800;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pernav{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:18px;padding:6px;box-shadow:var(--shadow);margin-bottom:12px}
.pernav button{width:44px;height:40px;border-radius:12px;background:var(--sky2);font-weight:900;font-size:18px}
.pernav b{font-size:16px}

/* ---- utang ---- */
.ut{padding:12px 4px;border-bottom:1px dashed var(--line)}
.ut:last-child{border:0}
.ut .r1{display:flex;justify-content:space-between;gap:8px;font-weight:900}
.ut .r2{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.prog{height:8px;border-radius:9px;background:var(--sky2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green2);border-radius:9px}
.tag{font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--rose);color:var(--pink)}
.tag.ok{background:var(--green);color:var(--green2)}

/* ---- settings ---- */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px;border-bottom:1px dashed var(--line);font-weight:800}
.set:last-child{border:0}
.set .muted{font-weight:700;font-size:13px}
.set button.lnk{color:var(--navy2);font-weight:900;background:var(--sky2);padding:8px 12px;border-radius:12px;font-size:14px}
.switch{width:52px;height:30px;border-radius:99px;background:#d7e2f0;position:relative;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.switch.on{background:var(--green2)}.switch.on:after{left:25px}
.catrow{display:flex;flex-wrap:wrap;gap:8px}
.catrow .cat{display:flex;align-items:center;gap:6px}
.catrow .cat b{color:var(--pink);font-size:16px;line-height:1}
.log{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.log .av{width:36px;height:36px;border-radius:12px;background:var(--sky2);display:grid;place-items:center;font-weight:900;flex:none}
.log .t1{font-weight:800;font-size:14px}
.log .t2{font-size:12px;color:var(--muted);font-weight:700}

/* ---- mascot animations ---- */
.mascot .arm-wave{transform-origin:86px 92px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}15%,45%{transform:rotate(-18deg)}30%{transform:rotate(10deg)}}
.mascot.hop{animation:hop 1.8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:200;background:var(--sky);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .3s}
#splash img{width:132px;height:132px;border-radius:34px;box-shadow:var(--shadow);animation:hop 1.4s ease-in-out infinite}
#splash .brand{font-size:30px}
#splash .tag2{color:var(--muted);font-weight:800;font-size:14px}

/* ---- print (reports → PDF) ---- */
@media print{
  body,html{background:#fff}
  .top,.nav,.toast,.noprint,.hello{display:none!important}
  #app{padding:0;max-width:none}
  .card,.stat{box-shadow:none;border:1px solid #ddd}
  .printhead{display:block!important}
}
.printhead{display:none;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash">
  <img src="logo.png" alt="">
  <div class="brand">KWENTO<span>INK</span></div>
  <div class="tag2">Tell your business story, simply.</div>
</div>
<div id="app" class="hidden">
  <div class="top">
    <img src="logo.png" alt="Kwentoink">
    <div class="tb">
      <div class="brand">KWENTO<span>INK</span><span id="demoChip" class="demo-chip hidden">DEMO</span></div>
      <div class="bizname" id="bizName"></div>
    </div>
    <div class="sync ok" id="syncBadge">✓</div>
    <button class="iconbtn" id="btn-settings" aria-label="Settings">⚙️</button>
  </div>
  <div id="view"></div>
</div>
<nav class="nav hidden" id="nav"><div class="nav-in">
  <button data-v="home" id="nav-home"><span class="e">🏠</span><span data-l="home"></span></button>
  <button data-v="list" id="nav-list"><span class="e">📒</span><span data-l="list"></span></button>
  <button class="fab" id="fab" aria-label="Add">+</button>
  <button data-v="utang" id="nav-utang"><span class="e">🤝</span><span data-l="utang"></span></button>
  <button data-v="report" id="nav-report"><span class="e">📊</span><span data-l="report"></span></button>
</div></nav>
<div id="toast" class="toast"></div>

<script>
/* =================================================================
   KWENTOINK — the app
   ================================================================= */

// ====== 1. PASTE YOUR APPS SCRIPT WEB APP URL HERE ======
const API_URL = 'https://script.google.com/macros/s/AKfycbwtNzMjBvyWxUDpFdPjF69wUlKkVW099st_29zvTVqeCJckM-FOLuUTgRXqCq99wxnE/exec';
// =========================================================

// IndexedDB key/value (for records + receipt photos — bigger than localStorage)
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('kwentoink', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode); const st = t.objectStore('kv');
      const out = fn(st);
      t.oncomplete = () => res(out instanceof IDBRequest ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('readonly', st => st.get(k)).catch(() => undefined),
    set: (k, v) => tx('readwrite', st => { st.put(v, k); }).catch(() => { }),
    del: k => tx('readwrite', st => { st.delete(k); }).catch(() => { })
  };
})();

/* =================================================================
   API (real Apps Script, or demo mode saved on this phone)
   ================================================================= */
async function api(action, payload, timeoutMs) {
  const body = Object.assign({ action, code: CODE, device: deviceId }, payload || {});
  if (DEMO) return mockApi(body);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs || 25000);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal, redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Server error');
    return j;
  } finally { clearTimeout(t); }
}

// ---- DEMO backend: lets you try/show Kwentoink before deploying ----
function mockApi(b) {
  const key = 'mock_' + CODE;
  const db = LS.get(key, { settings: null, entries: [], utang: [], log: [], receipts: {} });
  const save = () => LS.set(key, db);
  const trialEnds = new Date(); trialEnds.setDate(trialEnds.getDate() + 14);
  const payload = () => ({ ok: true, sub: { state: 'trial', daysLeft: 14, until: ymd(trialEnds) }, support: 'Demo mode', grace: 7, settings: db.settings, entries: db.entries, utang: db.utang });
  return new Promise(res => setTimeout(() => {
    if (b.action === 'init') return res(payload());
    if (b.action === 'setup') { db.settings = Object.assign({}, b.settings, { setupDone: true }); db.log.unshift({ time: nowIso(), by: b.by, action: 'setup', summary: b.settings.businessName }); save(); return res(payload()); }
    if (b.action === 'sync') {
      (b.ops || []).forEach(op => {
        if (op.op === 'settings') db.settings = Object.assign({}, db.settings, op.data);
        else {
          const arr = db[op.table]; const i = arr.findIndex(x => x.id === op.rec.id);
          if (i >= 0) { if (!(op.rec.updatedAt < arr[i].updatedAt)) arr[i] = op.rec; } else arr.push(op.rec);
        }
        db.log.unshift({ time: op.at, by: op.by, action: op.action || op.op, table: op.table, summary: op.summary });
      });
      db.log = db.log.slice(0, 300); save(); return res(payload());
    }
    if (b.action === 'receipt') { const id = 'demo_' + uid(); try { db.receipts[id] = { mime: b.mime, data: b.data.length < 900000 ? b.data : '' }; save(); } catch (e) { } return res({ ok: true, fileId: id }); }
    if (b.action === 'getReceipt') { const r = db.receipts[b.fileId] || {}; return res({ ok: true, mime: r.mime, data: r.data || '' }); }
    if (b.action === 'log') return res({ ok: true, log: db.log });
    res({ ok: false, error: 'unknown' });
  }, 150));
}

/* =================================================================
   SYNC ENGINE — everything saves on the phone first, then syncs
   ================================================================= */
async function loadCache() {
  const d = await DB.get(K('data'));
  if (d) Object.assign(S, { settings: d.settings, entries: d.entries || [], utang: d.utang || [], sub: d.sub, support: d.support || '', grace: d.grace || 7, lastOk: d.lastOk || 0 });
  S.ops = (await DB.get(K('ops'))) || [];
  S.rq = (await DB.get(K('rq'))) || [];
  S.log = (await DB.get(K('log'))) || [];
  ensureLocalPending();
  return !!d;
}
function saveCache() {
  return DB.set(K('data'), { settings: S.settings, entries: S.entries, utang: S.utang, sub: S.sub, support: S.support, grace: S.grace, lastOk: S.lastOk });
}
function applyServer(j) {
  S.settings = j.settings || S.settings;
  if (j.settings === null) S.settings = null;
  S.entries = j.entries || [];
  S.utang = j.utang || [];
  S.sub = j.sub; S.support = j.support || S.support; S.grace = j.grace || 7;
  S.lastOk = Date.now();
  ensureLocalPending();
}
// re-apply changes that haven't reached the server yet
function ensureLocalPending() { S.ops.forEach(applyLocal); }
function applyLocal(op) {
  if (op.op === 'settings') { S.settings = Object.assign({}, S.settings, op.data); return; }
  const arr = op.table === 'utang' ? S.utang : S.entries;
  const i = arr.findIndex(x => x.id === op.rec.id);
  if (i >= 0) { if (!(op.rec.updatedAt < arr[i].updatedAt)) arr[i] = Object.assign({}, arr[i], op.rec); }
  else arr.push(Object.assign({}, op.rec));
}
async function queueOp(op) {
  op.uid = uid('o'); op.at = nowIso(); op.by = myName() || 'Owner'; op.device = deviceId;
  S.ops.push(op); applyLocal(op);
  await DB.set(K('ops'), S.ops); saveCache();
  updateSyncBadge(); flush();
}
let flushTimer = null;
async function flush(force) {
  if (S.syncing) { if (force) setTimeout(() => flush(true), 1500); return; }
  if (!navigator.onLine && !DEMO) { updateSyncBadge(); return; }
  S.syncing = true; updateSyncBadge();
  try {
    // 1) upload waiting receipt photos
    for (const entryId of S.rq.slice()) {
      const r = await DB.get('rc_' + entryId);
      if (!r) { S.rq = S.rq.filter(x => x !== entryId); continue; }
      const data = await blobToB64(r.blob);
      const res = await api('receipt', { id: entryId, mime: r.mime, data }, 90000);
      await DB.set('rcache_' + res.fileId, r); // keep a local copy for fast viewing
      S.rq = S.rq.filter(x => x !== entryId); await DB.set(K('rq'), S.rq);
      const e = S.entries.find(x => x.id === entryId);
      if (e) {
        const rec = Object.assign({}, e, { receiptId: res.fileId, receiptMime: r.mime, updatedAt: nowIso() });
        delete rec.receiptLocal;
        S.ops.push({ op: 'upsert', table: 'entries', action: 'receipt', rec, summary: '📎 ' + L('Resibo', 'Receipt') + ' · ' + catName(catOf(e.cat)) + ' ' + money(e.amount), uid: uid('o'), at: nowIso(), by: myName(), device: deviceId });
        applyLocal(S.ops[S.ops.length - 1]); await DB.set(K('ops'), S.ops);
      }
    }
    // 2) send changes, get everyone's latest records back
    const sending = S.ops.slice();
    const j = await api('sync', { ops: sending.map(o => { const c = Object.assign({}, o); if (c.rec) { c.rec = Object.assign({}, c.rec); delete c.rec.receiptLocal; } return c; }) });
    const sent = new Set(sending.map(o => o.uid));
    S.ops = S.ops.filter(o => !sent.has(o.uid));
    await DB.set(K('ops'), S.ops);
    applyServer(j); await saveCache();
    gateCheck();
    if (!document.querySelector('.sheet.show') && !tourActive && !document.querySelector('.screen')) render();
    if (S.ops.length || S.rq.length) setTimeout(flush, 400); // changes made while we were syncing
  } catch (e) {
    console.warn('sync failed', e);
  } finally {
    S.syncing = false; updateSyncBadge();
  }
}
function updateSyncBadge() {
  const b = $('#syncBadge'); if (!b) return;
  const pending = S.ops.length + S.rq.length;
  if (S.syncing) { b.className = 'sync wait'; b.textContent = '⟳ ' + L('Nagsi-sync…', 'Syncing…'); }
  else if (!navigator.onLine && !DEMO) { b.className = 'sync off'; b.textContent = '📴 ' + (pending ? pending + ' ' + L('naka-save', 'saved') : 'Offline'); }
  else if (pending) { b.className = 'sync wait'; b.textContent = '⏳ ' + pending; }

/* ---------- receipts: shrink big iPhone photos before saving ---------- */
function blobToB64(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
}
async function shrinkPhoto(file) {
  if (file.type === 'application/pdf') {
    if (file.size > 20 * 1024 * 1024) throw new Error(L('Masyadong malaki ang PDF (max 20 MB)', 'PDF is too big (max 20 MB)'));
    return { blob: file, mime: 'application/pdf' };
  }
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.decoding = 'async'; img.src = url;
    await img.decode();
    const MAX = 1600;
    const w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, MAX / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * s); cv.height = Math.round(h * s);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.72));
    if (!blob) throw new Error('compress');
    return { blob, mime: 'image/jpeg' };
  } catch (e) {
    throw new Error(L('Hindi mabasa ang photo. Subukan ulit o mag-screenshot.', "Couldn't read that photo. Try again or use a screenshot."));
  } finally { URL.revokeObjectURL(url); }
}
async function getReceiptBlob(e) {
  let r = await DB.get('rc_' + e.id);
  if (r) return r;
  if (!e.receiptId) return null;
  r = await DB.get('rcache_' + e.receiptId);
  if (r) return r;
  if (!navigator.onLine && !DEMO) throw new Error(L('Kailangan ng internet para makita ang resibong ito', 'Need internet to view this receipt'));
  const j = await api('getReceipt', { fileId: e.receiptId }, 60000);
  if (!j.data) return null;
  const bin = atob(j.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  r = { blob: new Blob([arr], { type: j.mime }), mime: j.mime };
  DB.set('rcache_' + e.receiptId, r);
  return r;
}

const live = arr => arr.filter(x => !x.deleted);
function periodRange(p) {
  const d = new Date(); const t = ymd(d);
  if (p === 'today') return [t, t];
  if (p === 'week') { const s = new Date(d); const dow = (s.getDay() + 6) % 7; s.setDate(s.getDate() - dow); return [ymd(s), t]; }
  if (p === 'month') return [t.slice(0, 8) + '01', t];

}
function totals(from, to) {

function viewLog() {
  const icon = { add: '➕', edit: '✏️', delete: '🗑️', pay: '💸', receipt: '📎', settings: '⚙️', setup: '🎉', upsert: '✏️' };
  const word = { add: L('nagdagdag', 'added'), edit: L('nag-edit', 'edited'), delete: L('nagbura', 'deleted'), pay: L('nagtala ng bayad', 'recorded payment'), receipt: L('naglagay ng resibo', 'attached receipt'), settings: L('binago ang settings', 'changed settings'), setup: L('nag-setup ng negosyo', 'set up the business'), upsert: L('nag-update', 'updated') };
  let h = '<h2>📜 ' + L('Kasaysayan', 'Activity log') + '</h2><button class="btn soft" data-act="go" data-arg="settings" style="margin-bottom:12px">← Settings</button>';
  const pend = S.ops.map(o => ({ time: o.at, by: o.by, action: o.action || o.op, summary: o.summary, pending: true }));
  const rows = pend.reverse().concat(S.log);
  if (!rows.length) return h + '<div class="card empty"><div class="m">' + mascot('think') + '</div>' + ((!navigator.onLine && !DEMO) ? L('Kailangan ng internet para makita ang buong kasaysayan.', 'Need internet to load the full history.') : L('Wala pa.', 'Nothing yet.')) + '</div>';
  return h + '<div class="card" style="padding:6px 14px">' + rows.slice(0, 300).map(r => '<div class="log"><div class="av">' + (icon[r.action] || '•') + '</div><div><div class="t1">' + esc(r.by || '?') + ' ' + (word[r.action] || esc(r.action)) + '</div><div class="t2">' + esc(r.summary || '') + '</div><div class="t2">' + timeAgo(r.time) + (r.pending ? ' · ⏳ ' + L('hindi pa naka-sync', 'not synced yet') : '') + '</div></div></div>').join('') + '</div>';
}
async function loadLog() {
  if (!navigator.onLine && !DEMO) return;
  try { const j = await api('log', {}); S.log = j.log || []; DB.set(K('log'), S.log); if (S.view === 'log') render(); } catch (e) { }
}

/* =================================================================
   ACTIONS
   ================================================================= */
const ACTIONS = {
  period: a => { S.period = a; render(); },
  go: a => { go(a); if (a === 'log') loadLog(); },
  lfilter: a => { S.listFilter = a; render(); },
  edit: id => openEntry(S.entries.find(e => e.id === id)),
  utkind: a => { S.utKind = a; render(); },
  addUtang: () => openUtangForm(),
  openUtang: id => openUtangDetail(S.utang.find(u => u.id === id)),
  repmode: a => { S.repMode = a; render(); },
  repnav: a => {
    const y = +S.repMonth.slice(0, 4), m = +S.repMonth.slice(5, 7);
    const d = S.repMode === 'year' ? new Date(y + (+a), m - 1, 1) : new Date(y, m - 1 + (+a), 1);
    S.repMonth = d.getFullYear() + '-' + pad(d.getMonth() + 1); render();
  },
  exportCsv: () => exportCsv(),
  print: () => window.print(),
  lang: a => { LANG = a; LS.set(K('lang'), a); document.documentElement.lang = a === 'tl' ? 'tl' : 'en'; render(); },
  changeName: () => askName(true).then(render),
  editBiz: () => promptSheet(L('Pangalan ng negosyo', 'Business name'), S.settings.businessName, 'text').then(v => { if (v) saveSettings({ businessName: v.trim() }, L('Binago ang pangalan ng negosyo', 'Renamed business') + ': ' + v); }),
  editStart: () => promptSheet(L('Panimulang pera', 'Starting cash'), S.settings.startCash || 0, 'money').then(v => { if (v !== null) saveSettings({ startCash: num(v) }, L('Panimulang pera', 'Starting cash') + ': ' + money(num(v))); }),
  editCur: () => pickSheet('Currency', Object.keys(CURRENCIES).map(k => ({ v: k, label: CURRENCIES[k].f + ' ' + CURRENCIES[k][LANG] + ' (' + CURRENCIES[k].sym + ')' })), cur()).then(v => { if (v) { _nf = {}; saveSettings({ currency: v }, 'Currency: ' + v); } }),
  toggleUtang: () => saveSettings({ utangOn: !S.settings.utangOn }, 'Utang: ' + (!S.settings.utangOn ? 'ON' : 'OFF')),
  toggleMethod: k => { const m = (S.settings.methods || []).slice(); const i = m.indexOf(k); if (i >= 0) { if (m.length === 1) return; m.splice(i, 1); } else m.push(k); saveSettings({ methods: m }, METHODS[k][1]); },
  delCat: (k, el, ev) => { ev.stopPropagation(); if (!confirm(L('Alisin ang uring ito? (Hindi mabubura ang mga lumang listahan)', 'Remove this category? (Old records stay)'))) return; saveSettings({ categories: S.settings.categories.filter(c => c.k !== k) }, L('Inalis ang uri', 'Removed category')); },
  addCat: t => promptSheet(t === 'in' ? L('Bagong uri ng kita', 'New money-in category') : L('Bagong uri ng gastos', 'New expense category'), '', 'text').then(v => {
    if (!v) return; const cats = (S.settings.categories || []).slice(); cats.push({ k: 'c_' + uid(), t, i: '🏷️', name: v.trim() });
    saveSettings({ categories: cats }, L('Bagong uri', 'New category') + ': ' + v);
  }),
  replayTour: () => { go('home'); setTimeout(() => runTour(isOwnerDevice() ? 'full' : 'short'), 300); },
  showInstall: () => installGuide(true),
  syncNow: () => { flush(true); loadLog(); toast(L('Nagsi-sync…', 'Syncing…'), 'happy'); }
};
function saveSettings(data, summary) {
  queueOp({ op: 'settings', data, action: 'settings', summary }).then(render);
}

/* =================================================================
   SHEETS (pop-up panels)
   ================================================================= */
let sheetEl, backEl, sheetOnClose;
function openSheet(html, onClose) {
  closeSheet(true);
  backEl = document.createElement('div'); backEl.className = 'backdrop';
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet';
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(backEl, sheetEl);
  backEl.addEventListener('click', () => closeSheet());
  sheetOnClose = onClose;
  requestAnimationFrame(() => { backEl.classList.add('show'); sheetEl.classList.add('show'); });
  return sheetEl;
}
function closeSheet(instant) {
  if (!sheetEl) return;
  const s = sheetEl, b = backEl, cb = sheetOnClose; sheetEl = backEl = sheetOnClose = null;
  if (instant) { s.remove(); b.remove(); } else { s.classList.remove('show'); b.classList.remove('show'); setTimeout(() => { s.remove(); b.remove(); }, 250); }
  cb && cb();
}
function promptSheet(title, value, kind) {
  return new Promise(res => {
    let done = false;
    const el = openSheet('<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="x" data-x>×</button></div>' +
      (kind === 'money' ? '<div class="amtwrap"><span>' + sym() + '</span><input id="pv" inputmode="decimal" value="' + esc(value) + '"></div>' : '<input class="inp" id="pv" value="' + esc(value) + '" style="margin-bottom:12px">') +
      '<button class="btn main" data-ok>' + L('I-save', 'Save') + '</button>', () => { if (!done) res(null); });
    const i = el.querySelector('#pv'); setTimeout(() => i.focus(), 300);
    el.querySelector('[data-x]').onclick = () => closeSheet();
    el.querySelector('[data-ok]').onclick = () => { done = true; const v = i.value; closeSheet(); res(v); };
  });
}
function pickSheet(title, opts, sel) {
  return new Promise(res => {
    let done = false;
    const el = openSheet('<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="x" data-x>×</button></div><div class="opts">' +
      opts.map(o => '<button class="opt ' + (o.v === sel ? 'sel' : '') + '" data-v="' + o.v + '">' + o.label + '</button>').join('') + '</div>', () => { if (!done) res(null); });
    el.querySelector('[data-x]').onclick = () => closeSheet();
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { done = true; closeSheet(); res(b.dataset.v); });
  });
}

/* ---------- add / edit entry ---------- */
function openEntry(existing, preset) {
  const e = existing ? Object.assign({}, existing) : Object.assign({ id: uid('e'), type: 'in', amount: '', cat: '', method: (S.settings.methods || ['cash'])[0], date: today(), note: '' }, preset || {});
  const isNew = !existing;
  let pending = null; // new receipt {blob,mime}
  const cats = () => (S.settings.categories || []).filter(c => c.t === e.type && !c.sys);
  if (!e.cat) e.cat = (cats()[0] || {}).k;
  const el = openSheet(
    '<div class="sheet-head"><h2>' + (isNew ? L('Maglista', 'New record') : L('I-edit', 'Edit record')) + '</h2><button class="x" id="sh-close">×</button></div>' +
    '<div class="seg" id="sh-type"><button data-t="in" class="in">💚 ' + L('Kita (Pumasok)', 'Money In') + '</button><button data-t="out" class="out">🧡 ' + L('Gastos (Lumabas)', 'Expense') + '</button></div>' +
    '<div class="amtwrap" id="sh-amt"><span>' + sym() + '</span><input id="f-amt" inputmode="decimal" placeholder="0.00" value="' + (e.amount || '') + '" autocomplete="off"></div>' +
    '<div class="field" id="sh-cats"><label>' + L('Para saan?', 'What for?') + '</label><div class="catgrid" id="f-cats"></div></div>' +
    '<div class="field"><label>' + L('Paano binayaran?', 'Paid how?') + '</label><div class="catgrid" id="f-meth"></div></div>' +
    '<div class="row2"><div class="field"><label>' + L('Petsa', 'Date') + '</label><input class="inp" type="date" id="f-date" value="' + e.date + '"></div></div>' +
    '<div class="field"><label>' + L('Tala (opsyonal)', 'Note (optional)') + '</label><input class="inp" id="f-note" placeholder="' + L('hal. 3 kahon ng softdrinks', 'e.g. 3 cases of soda') + '" value="' + esc(e.note || '') + '"></div>' +
    '<div class="field" id="sh-rcpt"><label>' + L('Resibo (opsyonal)', 'Receipt (optional)') + '</label><label class="rcpt" for="f-file"><div class="ph" id="f-ph">📷</div><div><div class="b" id="f-rtxt">' + L('Kuhanan o pumili ng resibo', 'Take or choose a photo') + '</div><div class="small muted b">' + L('Kahit malaking iPhone photo, ok lang!', 'Big iPhone photos are fine!') + '</div></div></label>' +
    '<input type="file" id="f-file" accept="image/*,application/pdf" class="hidden"></div>' +
    '<button class="btn main" id="f-save">' + (isNew ? L('I-save', 'Save') : L('I-save ang pagbabago', 'Save changes')) + '</button>' +
    (isNew ? '' : '<button class="btn danger" id="f-del" style="margin-top:10px">🗑️ ' + L('Burahin', 'Delete') + '</button>') +
    (!isNew && e.by ? '<div class="small muted b" style="text-align:center;margin-top:12px">✍️ ' + L('Inilista ni ', 'Recorded by ') + esc(e.by) + (e.createdAt ? ' · ' + timeAgo(e.createdAt) : '') + '</div>' : '')
  );
  const paintType = () => {
    el.querySelectorAll('#sh-type button').forEach(b => b.classList.toggle('on', b.dataset.t === e.type));
    el.querySelector('#f-cats').innerHTML = cats().map(c => '<button class="cat ' + (c.k === e.cat ? 'sel' : '') + '" data-c="' + c.k + '">' + c.i + ' ' + esc(catName(c)) + '</button>').join('');
    el.querySelectorAll('#f-cats .cat').forEach(b => b.onclick = () => { e.cat = b.dataset.c; paintType(); });
  };
  const paintMeth = () => {
    el.querySelector('#f-meth').innerHTML = (S.settings.methods || ['cash']).map(k => '<button class="cat ' + (k === e.method ? 'sel' : '') + '" data-m="' + k + '">' + METHODS[k][0] + ' ' + METHODS[k][1] + '</button>').join('');
    el.querySelectorAll('#f-meth .cat').forEach(b => b.onclick = () => { e.method = b.dataset.m; paintMeth(); });
  };
  el.querySelectorAll('#sh-type button').forEach(b => b.onclick = () => { if (e.type === b.dataset.t) return; e.type = b.dataset.t; e.cat = (cats()[0] || {}).k; paintType(); });
  paintType(); paintMeth();
  el.querySelector('#sh-close').onclick = () => closeSheet();
  // existing receipt preview
  const showThumb = async r => {
    const ph = el.querySelector('#f-ph');
    if (r.mime === 'application/pdf') { ph.textContent = '📄'; } else { ph.outerHTML = '<img id="f-ph" src="' + URL.createObjectURL(r.blob) + '" alt="">'; }
    el.querySelector('#f-rtxt').textContent = L('May resibo ✓ (pindutin para palitan)', 'Receipt attached ✓ (tap to change)');
  };
  if (!isNew && (e.receiptId || e.receiptLocal)) {
    el.querySelector('#f-rtxt').textContent = L('May resibo ✓', 'Receipt attached ✓');
    const v = document.createElement('button'); v.className = 'btn soft'; v.style.marginTop = '8px'; v.textContent = '👀 ' + L('Tingnan ang resibo', 'View receipt');
    v.onclick = () => viewReceipt(e); el.querySelector('#sh-rcpt').appendChild(v);
    getReceiptBlob(e).then(r => r && showThumb(r)).catch(() => { });
  }
  el.querySelector('#f-file').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    el.querySelector('#f-rtxt').textContent = L('Inaayos ang photo…', 'Preparing photo…');
    try { pending = await shrinkPhoto(f); showThumb(pending); }
    catch (err) { pending = null; el.querySelector('#f-rtxt').textContent = err.message; }
  };
  const amt = el.querySelector('#f-amt');
  if (isNew) setTimeout(() => { if (!tourActive) amt.focus(); }, 320);
  el.querySelector('#f-save').onclick = async () => {
    const a = num(amt.value);
    if (!(a > 0)) { amt.parentElement.style.borderColor = 'var(--pink)'; amt.parentElement.style.boxShadow = '0 0 0 3px var(--pink)'; toast(L('Ilagay ang halaga', 'Enter the amount'), 'think'); return; }
    const rec = Object.assign({}, e, {
      amount: a, date: el.querySelector('#f-date').value || today(), note: el.querySelector('#f-note').value.trim(),
      catLabel: catName(catOf(e.cat)), updatedAt: nowIso()
    });
    if (isNew) { rec.createdAt = nowIso(); rec.by = myName() || 'Owner'; rec.device = deviceId; rec.deleted = false; }
    if (pending) {
      await DB.set('rc_' + rec.id, pending);
      rec.receiptLocal = true;
      if (!S.rq.includes(rec.id)) S.rq.push(rec.id);
      await DB.set(K('rq'), S.rq);
    }
    const sign = rec.type === 'in' ? '+' : '−';
    closeSheet();
    await queueOp({ op: 'upsert', table: 'entries', action: isNew ? 'add' : 'edit', rec, summary: sign + money(a) + ' · ' + rec.catLabel + (rec.note ? ' · ' + rec.note : '') });
    render(); toast(praise(), 'cheer');
  };
  const del = el.querySelector('#f-del');
  if (del) del.onclick = async () => {
    if (!confirm(L('Sigurado ka? Mabubura ang listahang ito.', 'Are you sure? This record will be deleted.'))) return;
    const rec = Object.assign({}, e, { deleted: true, updatedAt: nowIso() });
    closeSheet();
    await queueOp({ op: 'upsert', table: 'entries', action: 'delete', rec, summary: (e.type === 'in' ? '+' : '−') + money(e.amount) + ' · ' + catName(catOf(e.cat)) });
    render(); toast(L('Nabura na', 'Deleted'), 'happy');
  };
}
async function viewReceipt(e) {
  try {
    const r = await getReceiptBlob(e);
    if (!r) { toast(L('Wala pang kopya ng resibo', 'Receipt not available yet'), 'think'); return; }
    const url = URL.createObjectURL(r.blob);
    if (r.mime === 'application/pdf') { window.open(url, '_blank'); return; }
    openSheet('<div class="sheet-head"><h2>📎 ' + L('Resibo', 'Receipt') + '</h2><button class="x" data-x>×</button></div><img src="' + url + '" style="width:100%;border-radius:16px;box-shadow:var(--shadow)">').querySelector('[data-x]').onclick = () => closeSheet();
  } catch (err) { toast(err.message, 'sad'); }
}

    '<div class="row2" style="margin-top:12px"><button class="btn soft" id="u-edit">✏️ ' + L('I-edit', 'Edit') + '</button><button class="btn danger" id="u-del">🗑️ ' + L('Burahin', 'Delete') + '</button></div>');

    render();
  };
  const ps = el.querySelector('#p-save');
  if (ps) ps.onclick = async () => {
    const a = Math.min(num(el.querySelector('#p-amt').value), left);
    if (!(a > 0)) return;
    const paid = (u.paid || 0) + a;
    const rec = Object.assign({}, u, { paid, status: paid >= u.amount ? 'paid' : 'open', payments: (u.payments || []).concat([{ d: today(), amt: a, by: myName() }]), updatedAt: nowIso() });
    closeSheet();
    await queueOp({ op: 'upsert', table: 'utang', action: 'pay', rec, summary: '💸 ' + u.name + ' ' + money(a) });
    // record the cash movement automatically
    const isIn = u.kind === 'owed';
    const cat = isIn ? 'utang_in' : 'utang_out';
    const entry = { id: uid('e'), type: isIn ? 'in' : 'out', amount: a, cat, catLabel: catName(CAT_LIB[cat]), method: (S.settings.methods || ['cash'])[0], date: today(), note: u.name, createdAt: nowIso(), updatedAt: nowIso(), by: myName(), device: deviceId, deleted: false };
    await queueOp({ op: 'upsert', table: 'entries', action: 'add', rec: entry, summary: (isIn ? '+' : '−') + money(a) + ' · ' + entry.catLabel + ' · ' + u.name });
    render(); toast(rec.status === 'paid' ? L('Bayad na lahat! 🎉', 'Fully paid! 🎉') : praise(), 'cheer');
  };
}

/* ---------- export ---------- */
function exportCsv() {
  const isYear = S.repMode === 'year';
  const y = S.repMonth.slice(0, 4);
  const from = isYear ? y + '-01-01' : S.repMonth + '-01', to = isYear ? y + '-12-31' : S.repMonth + '-31';
  const rows = [[L('Petsa', 'Date'), L('Uri', 'Type'), L('Kategorya', 'Category'), L('Halaga', 'Amount') + ' (' + cur() + ')', L('Paraan', 'Method'), L('Tala', 'Note'), L('Inilista ni', 'Recorded by')]];
  live(S.entries).filter(e => e.date >= from && e.date <= to).sort((a, b) => a.date.localeCompare(b.date))
    .forEach(e => rows.push([e.date, e.type === 'in' ? L('Kita', 'Money In') : L('Gastos', 'Expense'), catName(catOf(e.cat)), (e.type === 'in' ? '' : '-') + (+e.amount).toFixed(2), (METHODS[e.method] || ['', e.method])[1], e.note || '', e.by || '']));
  const T = totals(from, to);
  rows.push([], ['', '', L('Kabuuang Kita', 'Total In'), T.inn.toFixed(2)], ['', '', L('Kabuuang Gastos', 'Total Out'), (-T.out).toFixed(2)], ['', '', L('Tubo', 'Profit'), T.profit.toFixed(2)]);
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'Kwentoink-' + (S.settings.businessName || 'report').replace(/[^\w-]+/g, '_') + '-' + (isYear ? y : S.repMonth) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast(L('Na-download na! Buksan sa Excel', 'Downloaded! Open it in Excel'), 'cheer');
}

      const btn = el.querySelector('#wn'); btn.disabled = true; btn.textContent = L('Sine-save…', 'Saving…');

    { sel: '#sh-amt', tl: 'I-type dito ang halaga.', en: 'Type the amount here.' },

    { sel: '#sh-rcpt', tl: 'Pwede kang magkuha ng picture ng resibo. Kahit malaki ang photo, ok lang!', en: 'You can snap the receipt. Big photos are fine!' },
    { sel: '#sh-close', action: 1, tl: 'Ayan! Pindutin ang <b>×</b> para isara muna.', en: 'Great! Tap <b>×</b> to close it for now.' },
    { sel: '#nav-list', tl: 'Sa <b>Listahan</b> makikita lahat ng nailista, at kung sino ang naglista.', en: '<b>Records</b> shows everything recorded, and who recorded it.' },
    { sel: '#nav-utang', tl: 'Sa <b>Utang</b> ililista kung sino ang may utang sa iyo, at utang mo.', en: '<b>Credit</b> tracks who owes you, and who you owe.', skipIf: () => !S.settings.utangOn },
    { sel: '#nav-report', tl: 'Sa <b>Ulat</b> makikita ang buwanang kita, at pwedeng i-download sa Excel o PDF.', en: '<b>Reports</b> shows your monthly results, with Excel or PDF download.' },
    { sel: '#syncBadge', tl: 'Kahit walang internet, naka-save sa phone. Kusa itong magsi-sync mamaya.', en: 'No internet? It saves on the phone and syncs by itself later.' },
    { sel: '#btn-settings', tl: 'Sa Settings: palitan ang wika, currency, o <b>ulitin ang tutorial</b>.', en: 'Settings: change language, currency, or <b>replay this tutorial</b>.' }
  ];
  if (kind === 'full') return full;
  return full.filter(s => ['#fab', '#sh-type', '#sh-rcpt', '#sh-close', '#nav-list'].includes(s.sel)).map(s => s.sel === '#fab' ? Object.assign({}, s, { tl: 'Ganito maglista: pindutin ang <b>+</b>.', en: 'Here\'s how to record: tap <b>+</b>.' }) : s);
}
function runTour(kind) {
  return new Promise(resolve => {
    const steps = tourSteps(kind).filter(s => !(s.skipIf && s.skipIf()));
    let i = 0, target = null, actionHandler = null;
    tourActive = true;
    const blks = [0, 1, 2, 3, 4].map(() => { const b = document.createElement('div'); b.className = 'blk'; document.body.appendChild(b); return b; });
    const ring = document.createElement('div'); ring.className = 'ring';
    const coach = document.createElement('div'); coach.className = 'coach';
    const arrow = document.createElement('div'); arrow.className = 'tap-arrow'; arrow.textContent = '👇';
    document.body.append(ring, coach, arrow);
    const blockTap = ev => { ev.preventDefault(); ev.stopPropagation(); };
    blks.forEach(b => { b.addEventListener('click', blockTap, true); b.addEventListener('touchstart', blockTap, { passive: false }); });
    const end = () => {
      tourActive = false;
      blks.forEach(b => b.remove()); ring.remove(); coach.remove(); arrow.remove();
      window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
      if (target && actionHandler) target.removeEventListener('click', actionHandler, true);
      closeSheet(true);
      LS.set(K('tour'), true); carryParams();
      toast(L('Handa ka na, Bossing! Good luck sa negosyo! 🎉', "You're all set! Good luck with the business! 🎉"), 'cheer');
      resolve();
    };
    function place() {
      if (!target) return;
      const r = target.getBoundingClientRect(), p = 6;
      const x = Math.max(0, r.left - p), y = Math.max(0, r.top - p), w = Math.min(innerWidth, r.width + p * 2), h = r.height + p * 2;
      const vw = innerWidth, vh = innerHeight;
      Object.assign(ring.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      Object.assign(blks[0].style, { left: 0, top: 0, width: vw + 'px', height: y + 'px' });
      Object.assign(blks[1].style, { left: 0, top: (y + h) + 'px', width: vw + 'px', height: Math.max(0, vh - y - h) + 'px' });
      Object.assign(blks[2].style, { left: 0, top: y + 'px', width: x + 'px', height: h + 'px' });
      Object.assign(blks[3].style, { left: (x + w) + 'px', top: y + 'px', width: Math.max(0, vw - x - w) + 'px', height: h + 'px' });
      // 5th blocker covers the hole on "info" steps so nothing can be pressed except Next
      const s = steps[i];
      Object.assign(blks[4].style, s.action ? { width: 0, height: 0 } : { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      const ch = coach.offsetHeight || 120;
      const below = y + h + 16 + ch < vh - 10;
      const above = y - ch - 16 > 10;
      let top;
      if (y + h / 2 > vh / 2 && above) top = y - ch - 50; else if (below) top = y + h + 50; else top = Math.max(10, y - ch - 50);
      top = Math.max(10 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safet')) || 0), Math.min(top, vh - ch - 10));
      coach.style.top = top + 'px';
      arrow.style.display = s.action ? 'block' : 'none';
      const pointDown = top < y;
      arrow.textContent = pointDown ? '👇' : '👆';
      arrow.style.left = Math.min(vw - 50, Math.max(4, x + w / 2 - 20)) + 'px';
      arrow.style.top = (pointDown ? y - 44 : y + h + 2) + 'px';
    }
    function show() {
      if (target && actionHandler) { target.removeEventListener('click', actionHandler, true); actionHandler = null; }
      if (i >= steps.length) return end();
      const s = steps[i];
      let tries = 0;
      const find = () => {
        target = document.querySelector(s.sel);
        if (!target || target.offsetParent === null && getComputedStyle(target).position !== 'fixed') {
          if (tries++ < 20) return setTimeout(find, 80);
          i++; return show(); // element not on screen — skip
        }
        const r = target.getBoundingClientRect();
        if (r.top < 70 || r.bottom > innerHeight - 90) { target.scrollIntoView({ block: 'center', behavior: 'instant' }); }
        coach.innerHTML = '<div class="m">' + mascot(s.action ? 'wave' : 'happy') + '</div><div style="flex:1"><div class="stepn">' + (i + 1) + ' / ' + steps.length + '</div><div class="txt">' + s[LANG] + '</div><div class="act">' +
          (s.action ? '<span class="small b muted">👆 ' + L('Pindutin ang nakailaw', 'Tap the highlighted button') + '</span>' : '<button class="go">' + (i === steps.length - 1 ? L('Tapos! 🎉', 'Done! 🎉') : L('Sige →', 'Next →')) + '</button>') +
          '<button class="skip">' + L('Laktawan', 'Skip') + '</button></div></div>';
        const go = coach.querySelector('.go'); if (go) go.onclick = () => { i++; show(); };
        coach.querySelector('.skip').onclick = end;
        if (s.action) {
          actionHandler = () => { target.removeEventListener('click', actionHandler, true); actionHandler = null; setTimeout(() => { i++; show(); }, 380); };
          target.addEventListener('click', actionHandler, true);
        }
        requestAnimationFrame(place); setTimeout(place, 300);
      };
      find();
    }
    window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
    show();
  });
}

/* ---------- gates: wrong link / ended / need internet ---------- */
let gateEl = null;
function gate(mood, title, msg, btn) {
  if (gateEl) gateEl.remove();
  gateEl = screen('<div style="flex:1"></div><div class="wz-m">' + mascot(mood) + '</div><div class="wz-q">' + title + '<small>' + msg + '</small></div>' + (btn ? '<button class="btn main" id="g-btn">' + btn + '</button>' : '') + '<div style="flex:1"></div>');
  gateEl.style.zIndex = 150;
  const b = gateEl.querySelector('#g-btn'); if (b) b.onclick = () => location.reload();
}
function gateCheck() {
  if (!S.sub) return false;
  if (S.sub.state === 'invalid') { gate('sad', L('Hindi gumagana ang link na ito', "This link doesn't work"), L('Baka luma na ang link. Humingi ng bagong Kwentoink link sa owner ng negosyo.', 'It may be an old link. Ask the business owner for the new Kwentoink link.')); return true; }
  if (S.sub.state === 'expired') { gate('sad', L('Naka-pause ang Kwentoink mo', 'Your Kwentoink is paused'), L('Tapos na ang trial o subscription. Ligtas ang lahat ng listahan mo! 💙<br><br>', 'Your trial or subscription has ended. All your records are safe! 💙<br><br>') + esc(S.support), L('Subukan ulit', 'Check again')); return true; }
  if (gateEl) { gateEl.remove(); gateEl = null; }
  return false;
}

/* =================================================================
   BOOT
   ================================================================= */
async function boot() {
  const hideSplash = () => { const sp = $('#splash'); if (sp) { sp.style.opacity = 0; setTimeout(() => sp.remove(), 300); } };
  if (DEMO) $('#demoChip').classList.remove('hidden');
  if (!CODE) { hideSplash(); gate('think', L('Kailangan ang link mo', 'You need your personal link'), L('Buksan ang Kwentoink gamit ang link na ibinigay sa iyo.', 'Open Kwentoink using the link you were given.')); return; }
  readCarried();
  const hadCache = await loadCache();
  if (S.settings && !LS.get(K('lang'), null) && S.settings.lang) LANG = S.settings.lang;
  document.documentElement.lang = LANG === 'tl' ? 'tl' : 'en';
  if (hadCache && S.settings) { showApp(); hideSplash(); }

  // talk to the server (in the background if we already showed cached data)
  let fresh = false;
  if (navigator.onLine || DEMO) {
    try {
      const j = S.ops.length ? await api('sync', { ops: S.ops }) : await api('init', {});
      if (S.ops.length) { S.ops = []; DB.set(K('ops'), S.ops); }
      applyServer(j); await saveCache(); fresh = true;
    } catch (e) { console.warn(e); }
  }
  if (S.settings && !LS.get(K('lang'), null) && S.settings.lang) LANG = S.settings.lang;
  hideSplash();
  if (gateCheck()) return;
  if (!S.settings && !fresh) {
    gate('think', L('Kailangan ng internet', 'Internet needed'), L('Sa unang bukas, kailangan ng internet. Pagkatapos nito, gagana na kahit offline!', 'The very first time needs internet. After that it works offline too!'), L('Subukan ulit', 'Try again'));
    return;
  }
  if (!fresh && S.lastOk && Date.now() - S.lastOk > S.grace * 86400000) {
    gate('think', L('Kumonekta sa internet', 'Please connect to the internet'), L('Matagal ka nang offline. Kumonekta saglit para ma-sync at ma-check ang account mo.', "You've been offline a long time. Connect briefly to sync and check your account."), L('Subukan ulit', 'Try again'));
    return;
  }
  // first-time on this phone
  if (needInstallGuide()) await installGuide(false);
  if (!S.settings) await setupWizard();
  if (!myName()) await askName(false);
  carryParams();
  showApp();
  if (!LS.get(K('tour'), false)) { go('home'); await new Promise(r => setTimeout(r, 400)); await runTour(isOwnerDevice() ? 'full' : 'short'); }
  flush(); loadLog();
}
let appShown = false;
function showApp() {
  $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  if (!appShown) {
    appShown = true;
    $$('.nav button[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
    $('#fab').onclick = () => openEntry();
    $('#btn-settings').onclick = () => go('settings');
    $('#syncBadge').onclick = () => { flush(true); };
  }
  go(S.view || 'home');
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();
</script>
