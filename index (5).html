      'Go to <b>🤝 Credit</b> → choose <b>Owed to Me</b> or <b>I Owe</b> → tap the pink button → enter the name, amount and how it will be paid (<b>One payment</b> or <b>Installment</b>) → <b>Save</b>.'], go: 'utang' },
  { t: 'utang', k: 'hulugan installment hulog lingguhan buwanan 15 araw schedule',
    q: ['Ano ang Hulugan at paano ito gamitin?', 'What is Installment (Hulugan)?'],
    a: ['Ang <b>Hulugan</b> ay bayad nang paunti-unti. Ilagay kung ilang hulog, gaano kadalas (Lingguhan, Kada 15 araw, Buwanan), at kailan ang unang hulog. Ako na ang gagawa ng iskedyul at magsasabi kung kailan ang susunod at kung may lampas na.',
      '<b>Installment</b> means paying little by little. Enter how many payments, how often (Weekly, Every 15 days, Monthly) and the first due date. I make the schedule and show the next due date and anything overdue.'], go: 'utang' },
  { t: 'utang', k: 'bayad nagbayad payment record utang paid hulog',
    q: ['Paano i-record ang bayad sa utang?', 'How do I record a payment on credit?'],
    a: ['Sa <b>🤝 Utang</b>, pindutin ang pangalan → ilagay ang halagang binayad (naka-handa na ang susunod na hulog) → <b>Nagbayad sila</b> o <b>Nagbayad ako</b>. Kusa itong maililista sa Kita o Gastos.',
      'In <b>🤝 Credit</b>, tap the name → enter the amount paid (the next installment is pre-filled) → <b>They paid</b> or <b>I paid</b>. It\'s automatically recorded as Money In or an Expense.'], go: 'utang' },
  { t: 'utang', k: 'bakit kita bayad utang doble double counted',
    q: ['Bakit naging Kita ang bayad sa utang?', 'Why did a credit payment become Money In?'],
    a: ['Kasi doon lang pumasok ang pera sa kahon mo. Kapag umutang ang customer, wala pang pera — kaya hindi pa ito Kita. Pag nagbayad na, saka ito nagiging Kita. Kaya hindi ito nadodoble.',
      'Because that\'s when the cash actually came in. When the customer takes goods on credit, no money has arrived yet, so it\'s not Money In yet. Once they pay, it becomes Money In. So nothing is counted twice.'] },
  { t: 'utang', k: 'lampas overdue late due singilin collect',
    q: ['Ano ang ibig sabihin ng "Lampas na"?', 'What does "Overdue" mean?'],
    a: ['Lumampas na ang petsa ng bayad pero hindi pa bayad. Makikita mo ito sa 🤝 Utang at sa <b>Ulat → Ulat ng Utang</b>, kasama ang listahan ng dapat singilin.',
      'The due date has passed and it\'s still unpaid. You\'ll see it in 🤝 Credit and in <b>Reports → Credit report</b>, with a list of who to collect from.'], go: 'utang' },
  { t: 'utang', k: 'invoice singil bill billing statement gumawa create',
    q: ['Paano gumawa ng singil (invoice)?', 'How do I make an invoice?'],
    a: ['Pumunta sa <b>🤝 Utang → Utang sa Akin</b> → <b>🧾 Gumawa ng Singil</b>. Ilagay ang customer, mga item (pangalan, dami, presyo), at due date. Kusa itong maidadagdag sa Utang sa Akin. Pwede ring gumawa ng singil mula sa kahit anong utang: buksan ito → <b>🧾 Singil</b>.',
      'Go to <b>🤝 Credit → Owed to Me</b> → <b>🧾 New invoice</b>. Enter the customer, items (name, quantity, price) and due date. It\'s added to Owed to Me automatically. You can also make an invoice from any credit record: open it → <b>🧾 Invoice</b>.'], go: 'invoice' },
  { t: 'utang', k: 'send invoice ipadala messenger share pdf print',
    q: ['Paano ipadala ang singil sa customer?', 'How do I send the invoice to a customer?'],
    a: ['Buksan ang singil → <b>📤 I-share</b> para ipadala sa Messenger/Viber bilang text, o <b>📄 PDF</b> para i-save bilang PDF at i-send. Pwede ring <b>📋 Kopyahin</b> at i-paste.',
      'Open the invoice → <b>📤 Share</b> to send it via Messenger/Viber as text, or <b>📄 PDF</b> to save it as a PDF and send it. You can also <b>📋 Copy</b> and paste.'] },

  // ---------- reports & money ----------
  { t: 'rep', k: 'tubo profit kita kinita net income',
    q: ['Ano ang Tubo?', 'What is Profit (Tubo)?'],
    a: ['<b>Tubo = Kita − Gastos.</b> Ito ang talagang kinita ng negosyo. Hindi kasama dito ang puhunang inilagay mo o ang perang kinuha mo para sa sarili.',
      '<b>Profit = Money In − Expenses.</b> It\'s what the business really earned. It doesn\'t include capital you put in or money you took for yourself.'], go: 'report' },
  { t: 'rep', k: 'pera mo ngayon cash on hand kahon hawak tantiya',
    q: ['Ano ang "Pera mo ngayon"?', 'What is "Cash on hand"?'],
    a: ['Tantiya ito ng perang hawak ng negosyo ngayon: <b>Panimulang pera + lahat ng Kita − lahat ng Gastos</b> (kasama ang puhunan at kinuha mo). Tama ito kung lahat ay nailista.',
      'It\'s an estimate of the money the business has now: <b>Starting cash + all Money In − all Expenses</b> (including capital and withdrawals). It\'s right as long as everything is recorded.'] },
  { t: 'rep', k: 'mali pera ngayon wrong cash starting panimula ayusin',
    q: ['Mali ang "Pera mo ngayon". Paano ayusin?', '"Cash on hand" is wrong. How do I fix it?'],
    a: ['Bilangin ang totoong pera sa kahon at GCash. Kung iba, baka may hindi nailista. Pwede ring ayusin ng owner ang <b>Panimulang pera</b> sa Settings para tumugma.',
      'Count the real money in the box and GCash. If it\'s different, something may not be recorded. The owner can also adjust <b>Starting cash</b> in Settings so it matches.'], go: 'settings' },
  { t: 'rep', k: 'excel download pdf print export ulat report',
    q: ['Paano i-download ang ulat sa Excel o PDF?', 'How do I download reports as Excel or PDF?'],
    a: ['Owner lang: pumunta sa <b>📊 Ulat</b> → piliin ang buwan o taon → sa pinakababa, pindutin ang <b>📗 Excel</b> o <b>📄 PDF / Print</b>. Kasama sa Excel ang lahat ng ulat at listahan.',
      'Owner only: go to <b>📊 Reports</b> → pick the month or year → at the bottom tap <b>📗 Excel</b> or <b>📄 PDF / Print</b>. The Excel file includes every report and all records.'], go: 'report' },
  { t: 'rep', k: 'profit loss p&l income statement kita at gastos report',
    q: ['Ano ang "Kita at Gastos" report (Profit & Loss)?', 'What is the Profit & Loss report?'],
    a: ['Ipinapakita nito kada kategorya kung saan galing ang kita at saan napunta ang gastos, tapos ang <b>Tubo (Net)</b>. Ito ang pinakamahalagang ulat para malaman kung kumikita ang negosyo.',
      'It shows, by category, where the money came from and where it went, then the <b>Net Profit</b>. It\'s the most important report for knowing if the business is earning.'], go: 'report' },
  { t: 'rep', k: 'halaga negosyo balance sheet net worth equity worth',
    q: ['Ano ang "Halaga ng Negosyo"?', 'What is "Business worth"?'],
    a: ['Ito ang <b>Balance Sheet</b> sa simpleng salita: <b>lahat ng meron ang negosyo</b> (pera, utang sa iyo, gamit/ari-arian) <b>bawas lahat ng utang mo</b>. Ang matitira ay ang tunay na halaga ng negosyo mo.',
      'It\'s the <b>Balance Sheet</b> in plain words: <b>everything the business owns</b> (cash, money owed to you, equipment/assets) <b>minus everything it owes</b>. What\'s left is what your business is really worth.'], go: 'report' },
  { t: 'rep', k: 'staff ulat report hidden bakit hindi makita',
    q: ['Bakit hindi nakikita ng staff ang Ulat?', 'Why can\'t staff see Reports?'],
    a: ['Para sa privacy ng owner, ang <b>Ulat</b>, <b>Tubo</b>, at <b>Pera mo ngayon</b> ay para sa owner lang. Ang staff ay nakakakita ng Kita at Gastos para sa trabaho nila.',
      'For the owner\'s privacy, <b>Reports</b>, <b>Profit</b> and <b>Cash on hand</b> are owner-only. Staff see Money In and Expenses for their work.'] },

  // ---------- capital & assets ----------
  { t: 'own', k: 'puhunan capital investment pera ko sariling add money',
    q: ['Ano ang puhunan at paano ito ilista?', 'What is capital (puhunan) and how do I record it?'],
    a: ['Ang <b>puhunan</b> ay sariling pera mong inilagay sa negosyo. Owner lang: pindutin ang <b>+</b> → <b>💚 Kita</b> → piliin ang <b>👛 Dagdag puhunan</b>. Madadagdagan ang pera mo ngayon pero <b>hindi</b> ito ituturing na kita, para tama ang tubo.',
      '<b>Capital</b> is your own money put into the business. Owner only: tap <b>+</b> → <b>💚 Money In</b> → choose <b>👛 Added capital</b>. Cash on hand goes up but it\'s <b>not</b> counted as income, so profit stays correct.'], go: 'add' },
  { t: 'own', k: 'kinuha sarili personal withdraw owner draw pamilya',
    q: ['Kumuha ako ng pera para sa sarili. Paano ilista?', 'I took money for personal use. How do I record it?'],
    a: ['Owner lang: pindutin ang <b>+</b> → <b>🧡 Gastos</b> → piliin ang <b>👛 Kinuha ko para sa sarili</b>. Mababawasan ang pera mo ngayon pero <b>hindi</b> ito ituturing na gastos ng negosyo.',
      'Owner only: tap <b>+</b> → <b>🧡 Expense</b> → choose <b>👛 Taken for personal use</b>. Cash on hand goes down but it\'s <b>not</b> counted as a business expense.'], go: 'add' },
  { t: 'own', k: 'bakit hindi gastos kinuha withdrawal not expense',
    q: ['Bakit hindi kasama sa gastos ang kinuha ko para sa sarili?', 'Why isn\'t money I took counted as an expense?'],
    a: ['Ang <b>gastos</b> ay para patakbuhin ang negosyo (paninda, upa). Ang <b>kinuha mo</b> ay parte mo sa kinita — parang sahod mo. Kung isasama sa gastos, magmumukhang maliit ang tubo kahit maayos ang negosyo. Makikita mo pa rin ang kabuuang kinuha mo sa Ulat.',
      '<b>Expenses</b> are for running the business (stock, rent). <b>What you took</b> is your share of the earnings — like your salary. If it were counted as an expense, profit would look small even when the business is doing well. You can still see the total you took in Reports.'] },
  { t: 'own', k: 'ari arian asset gamit equipment freezer motor inventory paninda dagdag',
    q: ['Ano ang Ari-arian at paano magdagdag?', 'What are assets and how do I add them?'],
    a: ['Ang <b>ari-arian</b> ay mga gamit ng negosyo na may halaga — hal. freezer, motor, tindahan, o paninda sa estante. Owner lang: <b>📊 Ulat → Halaga ng Negosyo → ＋ Ari-arian</b>. Ilagay ang pangalan at tantiyang halaga ngayon.',
      '<b>Assets</b> are things the business owns that have value — e.g. a freezer, motorcycle, store, or stock on the shelves. Owner only: <b>📊 Reports → Business worth → ＋ Asset</b>. Enter the name and its estimated value today.'], go: 'assets' },

  // ---------- owner & staff ----------
  { t: 'team', k: 'pin owner pin 4 digit password security',
    q: ['Ano ang Owner PIN?', 'What is the Owner PIN?'],
    a: ['Ito ang 4-digit na numero ng owner. Dito nalalaman ng Kwentoink na ikaw ang owner — kaya ikaw lang ang makakakita ng Ulat, makaka-edit ng lahat, at makakapagpalit ng settings. Huwag itong ibigay sa staff.',
      'It\'s the owner\'s 4-digit number. It tells Kwentoink you\'re the owner — so only you can see Reports, edit everything and change settings. Don\'t share it with staff.'] },
  { t: 'team', k: 'nakalimutan pin forgot reset palitan',
    q: ['Nakalimutan ko ang PIN. Paano?', 'I forgot my PIN. What do I do?'],
    a: ['Mag-message sa nagbigay sa iyo ng Kwentoink para i-reset ang PIN. Pagkatapos, buksan agad ang Kwentoink — hihingan ka ng bagong PIN. Ligtas ang lahat ng listahan mo.',
      'Message whoever gave you Kwentoink to reset the PIN. Then open Kwentoink right away — it will ask you to create a new PIN. All your records are safe.'], go: 'support' },
  { t: 'team', k: 'owner ibang phone unlock maging owner second device',
    q: ['Paano maging owner sa ibang phone?', 'How do I become owner on another phone?'],
    a: ['Sa phone na iyon: <b>Settings ⚙️ → Ako ang Owner</b> → ilagay ang PIN. Kailangan ng internet. Para bumalik sa staff mode: Settings → <b>Gawing Staff</b>.',
      'On that phone: <b>Settings ⚙️ → I\'m the Owner</b> → enter the PIN. Internet is needed. To go back to staff mode: Settings → <b>Switch to Staff</b>.'], go: 'settings' },
  { t: 'team', k: 'staff kaya lock naka lock bawal hindi ma edit permission',
    q: ['Ano ang kaya ng staff? Bakit naka-🔒?', 'What can staff do? Why is it locked 🔒?'],
    a: ['Ang staff ay pwedeng <b>magdagdag</b> ng kita, gastos, resibo, at bayad sa utang. Pero hindi nila ma-eedit ang listahan ng iba, hindi makikita ang Ulat at Tubo, at hindi mapapalitan ang settings. Ang pag-edit ng sarili nilang listahan ay depende sa patakaran ng owner.',
      'Staff can <b>add</b> money in, expenses, receipts and credit payments. But they can\'t edit other people\'s records, can\'t see Reports or Profit, and can\'t change settings. Editing their own records depends on the owner\'s rule.'] },
  { t: 'team', k: 'patakaran rule staff edit same day never always palitan',
    q: ['Paano palitan ang patakaran sa pag-edit ng staff?', 'How do I change the staff editing rule?'],
    a: ['Owner lang: <b>Settings ⚙️ → Pwede bang mag-edit ang staff?</b> Piliin: <b>Sa parehong araw lang</b>, <b>Hindi pwede</b>, o <b>Palagi (sariling listahan)</b>.',
      'Owner only: <b>Settings ⚙️ → Can staff edit?</b> Choose: <b>Same day only</b>, <b>Never</b>, or <b>Always (own records)</b>.'], go: 'settings' },
  { t: 'team', k: 'bell abiso notification alert staff edit bura',
    q: ['Ano ang 🔔 sa itaas?', 'What is the 🔔 at the top?'],
    a: ['Para sa owner: dito ka aabisuhan kapag may <b>in-edit o binura ang staff</b>. Makikita mo kung sino, ano, at kailan — pati ang dating halaga. Pwede ka ring makatanggap ng email: Settings → <b>Email para sa abiso</b>.',
      'For the owner: you get notified here when <b>staff edit or delete something</b>. You see who, what and when — including the old amount. You can also get emails: Settings → <b>Email alerts</b>.'], go: 'alerts' },
  { t: 'team', k: 'activity log kasaysayan sino nag edit history audit',
    q: ['Paano makita kung sino ang nagdagdag o nag-edit?', 'How do I see who added or changed what?'],
    a: ['Bawat listahan ay may "✍️ pangalan" ng naglista. Para sa buong kasaysayan: <b>Settings ⚙️ → Kasaysayan ng pagbabago</b>.',
      'Every record shows "✍️ name" of who recorded it. For the full history: <b>Settings ⚙️ → Activity log</b>.'], go: 'log' },

  // ---------- offline & sync ----------
  { t: 'sync', k: 'offline walang internet no signal data gumagana',
    q: ['Gumagana ba kahit walang internet?', 'Does it work without internet?'],
    a: ['Oo! Naka-save muna sa phone ang lahat ng ilista mo, tapos kusa itong magsi-sync pag may internet na. Kailangan lang ng internet sa unang bukas, sa pag-check ng PIN, at sa pagtingin ng resibong galing sa ibang phone.',
      'Yes! Everything you record is saved on the phone first, then synced automatically when you\'re back online. Internet is only needed the very first time, for checking the PIN, and for viewing receipts from other phones.'] },
  { t: 'sync', k: 'sync badge synced naka save orange number ibig sabihin',
    q: ['Ano ang ibig sabihin ng "✓ Synced na" o "⏳ 2" sa itaas?', 'What do "✓ Synced" or "⏳ 2" at the top mean?'],
    a: ['<b>✓ Synced na</b> = naka-save na online ang lahat. <b>⏳ 2</b> = may 2 bagay pang isi-sync. <b>📴 Offline</b> = walang internet, pero naka-save sa phone. Pindutin ito para mag-sync ngayon.',
      '<b>✓ Synced</b> = everything is saved online. <b>⏳ 2</b> = 2 items still waiting to sync. <b>📴 Offline</b> = no internet, but saved on the phone. Tap it to sync now.'] },
  { t: 'sync', k: 'ligtas safe data saan naka save backup mawala lost',
    q: ['Ligtas ba ang data ko? Saan ito naka-save?', 'Is my data safe? Where is it saved?'],
    a: ['Naka-save ang lahat online sa sariling Google Sheet ng negosyo mo, at ang resibo sa sariling folder. Kahit masira o mawala ang phone, buksan lang ang link sa bagong phone at nandoon pa rin lahat.',
      'Everything is saved online in your business\'s own Google Sheet, and receipts in their own folder. Even if the phone breaks or gets lost, open your link on a new phone and everything is still there.'] },
  { t: 'sync', k: 'hindi nagsi sync not syncing stuck problema',
    q: ['Hindi nagsi-sync. Ano ang gagawin?', 'It isn\'t syncing. What should I do?'],
    a: ['1) Siguraduhing may internet. 2) Pindutin ang sync badge sa itaas o Settings → <b>I-sync ngayon</b>. 3) Isara at buksan ulit ang Kwentoink. Hindi mawawala ang naka-save sa phone habang hinihintay.',
      '1) Make sure you have internet. 2) Tap the sync badge at the top or Settings → <b>Sync now</b>. 3) Close and reopen Kwentoink. Nothing saved on the phone is lost while it waits.'], go: 'settings' },

  // ---------- tax & pricing ----------
  { t: 'tax', k: 'vat 12 percent tax buwis value added',
    q: ['Ano ang VAT?', 'What is VAT?'],
    a: ['Ang <b>VAT</b> ay 12% na buwis na idinadagdag sa presyo ng mga <b>VAT-registered</b> na negosyo. Hindi ito tubo mo — kinokolekta mo lang ito para sa BIR. Kailangang mag-register sa VAT kapag lumampas sa ₱3 milyon ang benta sa isang taon.',
      '<b>VAT</b> is a 12% tax added to prices by <b>VAT-registered</b> businesses. It\'s not your profit — you collect it for the BIR. A business must register for VAT when sales go over ₱3 million a year.'] },
  { t: 'tax', k: 'dagdag 12 vat presyo kailangan ba add price non vat',
    q: ['Kailangan ko bang magdagdag ng 12% VAT sa presyo?', 'Do I need to add 12% VAT to my prices?'],
    a: ['<b>Kung non-VAT ka (karamihan ng maliit na negosyo): hindi.</b> Idadagdag lang ang 12% kung VAT-registered ka. At tandaan: hindi pwedeng puhunan + 12% lang — kailangan mo munang magdagdag ng <b>tubo</b>, saka ang VAT. Gamitin ang <b>🏷️ Presyo calculator</b>.',
      '<b>If you\'re non-VAT (most small businesses): no.</b> Only add 12% if you\'re VAT-registered. And remember: it can\'t just be cost + 12% — add your <b>profit markup</b> first, then VAT. Use the <b>🏷️ Price calculator</b>.'], go: 'price' },
  { t: 'tax', k: 'percentage tax 3 percent 8 percent income tax bir non vat',
    q: ['Ano ang 3% percentage tax at 8% income tax?', 'What are the 3% percentage tax and 8% income tax?'],
    a: ['Para sa <b>non-VAT</b> na negosyo: karaniwang <b>3% percentage tax</b> sa benta. O kaya, puwedeng piliin ang <b>8% income tax</b> sa benta na lampas ₱250,000 sa isang taon (kapalit ng 3% at ng regular na income tax). Itakda ito sa Settings → <b>Buwis</b> para makita ang tantiya sa Ulat. Tantiya lang ito — kumpirmahin sa accountant o BIR.',
      'For <b>non-VAT</b> businesses: usually a <b>3% percentage tax</b> on sales. Or you may choose the <b>8% income tax</b> on sales above ₱250,000 a year (replacing the 3% and regular income tax). Set it in Settings → <b>Tax</b> to see an estimate in Reports. It\'s only an estimate — confirm with an accountant or the BIR.'], go: 'settings' },
  { t: 'tax', k: 'presyo pricing markup tubo magkano benta price selling',
    q: ['Paano malaman kung magkano ang ibebenta ko?', 'How do I decide my selling price?'],
    a: ['Gamitin ang <b>🏷️ Presyo calculator</b> sa Home: ilagay ang puhunan kada piraso at kung ilang % na tubo ang gusto mo (hal. 30%). Ibibigay ko ang presyo at tubo kada piraso. Kung VAT-registered ka, idadagdag ko rin ang 12%.',
      'Use the <b>🏷️ Price calculator</b> on Home: enter the cost per piece and how much profit you want (e.g. 30%). I\'ll give you the price and profit per piece. If you\'re VAT-registered, I add the 12% too.'], go: 'price' },
  { t: 'tax', k: 'calculator kuwenta compute math',
    q: ['Paano gamitin ang calculator?', 'How do I use the calculator?'],
    a: ['Pindutin ang <b>🧮 Calculator</b> sa Home. Pagkatapos magkuwenta, pwede mong pindutin ang <b>Ilista ito</b> para diretsong ilagay ang sagot sa bagong listahan.',
      'Tap <b>🧮 Calculator</b> on Home. After calculating, tap <b>Record this</b> to put the answer straight into a new record.'], go: 'calc' },

  // ---------- bookkeeping words ----------
  { t: 'words', k: 'asset liability equity balance meaning salita bookkeeping terms',
    q: ['Ano ang asset, liability, at equity sa simpleng salita?', 'What are assets, liabilities and equity in plain words?'],
    a: ['<b>Asset (ari-arian)</b> = lahat ng meron ang negosyo: pera, utang sa iyo, gamit, paninda. <b>Liability (utang)</b> = lahat ng utang ng negosyo. <b>Equity (halaga ng negosyo)</b> = Asset − Liability. Sa Kwentoink: Ulat → <b>Halaga ng Negosyo</b>.',
      '<b>Asset</b> = everything the business owns: cash, money owed to you, equipment, stock. <b>Liability</b> = everything the business owes. <b>Equity</b> = Assets − Liabilities. In Kwentoink: Reports → <b>Business worth</b>.'] },
  { t: 'words', k: 'revenue income expense profit loss salita meaning',
    q: ['Ano ang revenue, expense, profit, at loss?', 'What are revenue, expense, profit and loss?'],
    a: ['<b>Revenue/Income</b> = Kita. <b>Expense</b> = Gastos. <b>Profit</b> = Tubo (kapag mas malaki ang kita). <b>Loss</b> = Lugi (kapag mas malaki ang gastos).',
      '<b>Revenue/Income</b> = Money In. <b>Expense</b> = money spent to run the business. <b>Profit</b> = when income is bigger. <b>Loss</b> = when expenses are bigger.'] },
  { t: 'words', k: 'receivable payable accounts salita meaning',
    q: ['Ano ang receivable at payable?', 'What are receivables and payables?'],
    a: ['<b>Receivable</b> = pera na dapat bayaran SA IYO (Utang sa Akin). <b>Payable</b> = pera na dapat mong BAYARAN (Utang Ko).',
      '<b>Receivable</b> = money owed TO YOU (Owed to Me). <b>Payable</b> = money YOU owe (I Owe).'] },
  { t: 'words', k: 'gross net sales kabuuan meaning margin',
    q: ['Ano ang gross at net?', 'What do gross and net mean?'],
    a: ['<b>Gross</b> = kabuuan bago bawasan (hal. lahat ng benta). <b>Net</b> = natira pagkatapos bawasan (hal. tubo = benta − gastos).',
      '<b>Gross</b> = the total before subtracting anything (e.g. all sales). <b>Net</b> = what\'s left after subtracting (e.g. profit = sales − expenses).'] },

  // ---------- problems & account ----------
  { t: 'fix', k: 'subscription trial bayad libre free plan expire',
    q: ['Paano ang subscription at free trial?', 'How do the subscription and free trial work?'],
    a: ['May libreng trial ka sa simula. Makikita kung ilang araw pa sa Settings → <b>Subscription</b>. Para magpatuloy, magbayad sa nagbigay sa iyo ng Kwentoink (hal. GCash).',
      'You start with a free trial. See how many days are left in Settings → <b>Subscription</b>. To continue, pay whoever gave you Kwentoink (e.g. via GCash).'], go: 'support' },

const HELP_STOP = new Set('ano ang ng sa mga paano ko ba na at the how what is a an to do i my ako po yung nga kung para can it this ito mo ka si ni kay din rin lang naman does why bakit saan where when kailan'.split(' '));
const hnorm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/<[^>]+>/g, ' ').replace(/[^a-z0-9%₱ ]+/g, ' ');
function helpSearch(q) {
  const toks = hnorm(q).split(/\s+/).filter(w => w.length > 1 && !HELP_STOP.has(w));
  if (!toks.length) return [];
  return HELP.map((h, i) => {
    const qw = hnorm(h.q[0] + ' ' + h.q[1]).split(/\s+/), kw = hnorm(h.k).split(/\s+/), body = hnorm(h.a[0] + ' ' + h.a[1]);
    let sc = 0, hit = 0;
    toks.forEach(t => {
      let m = 0;
      if (qw.some(w => w.startsWith(t))) m += 3;
      if (kw.some(w => w.startsWith(t) || (t.length > 3 && w.startsWith(t.slice(0, -1))))) m += 3;
      if (!m && body.includes(t)) m += 1;
      if (m) hit++; sc += m;
    });
    if (hit === toks.length) sc += 2; // all words matched
    return { i, sc };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 8);
}

        body: () => opt('bills', BILLS.map(k => [k, CAT_LIB[k].i, CAT_LIB[k][LANG], '']), true), get: () => 1 },
      { q: () => L('Ayos! Handa na ang Kwentoink mo! 🎉', 'All set! Your Kwentoink is ready! 🎉') + '<small>' + esc(A.businessName) + ' · ' + CURRENCIES[A.currency].f + ' ' + CURRENCIES[A.currency].sym + '</small>', m: 'cheer',
        body: () => '<div class="card b" style="text-align:center;line-height:1.5">' + L('Kapag may benta, pindutin ang <b>+</b> at ilista. Kapag may gastos, ganun din. Ako na ang bahala sa pagkuwenta! 🐃✍️', "When you make a sale, tap <b>+</b> and record it. Same for expenses. I'll do the math! 🐃✍️") + '</div>', final: true }
    ];
    function opt(key, list, multi) {
      return '<div class="opts">' + list.map(o => {
        const sel = multi ? A[key].includes(o[0]) : A[key] === o[0];
        return '<button class="opt ' + (sel ? 'sel' : '') + '" data-k="' + key + '" data-v=\'' + JSON.stringify(o[0]) + '\'' + (multi ? ' data-multi="1"' : '') + '><span class="e">' + o[1] + '</span><span>' + esc(o[2]) + (o[3] ? '<small>' + esc(o[3]) + '</small>' : '') + '</span></button>';
      }).join('') + '</div>';
    }
    function paint() {
      const s = steps[i];
      el.querySelector('.inner').innerHTML =
        '<div class="wz-top"><button class="iconbtn ' + (i ? '' : 'hidden') + '" id="wb">←</button><div class="dots">' + steps.map((_, j) => '<i class="' + (j === i ? 'on' : '') + '"></i>').join('') + '</div><div style="width:42px"></div></div>' +
        '<div class="wz-m">' + mascot(s.m, 'hop') + '</div><div class="wz-q">' + s.q() + '</div>' + s.body() +
        '<div class="wz-foot">' + (s.auto ? '' : '<button class="btn ' + (s.final ? 'pink' : 'main') + '" id="wn">' + (s.final ? L('Simulan na! 🚀', "Let's go! 🚀") : L('Sunod →', 'Next →')) + '</button>') + '</div>';
      const inp = el.querySelector('#wv');
      if (inp) { setTimeout(() => inp.focus(), 250); inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') next(); }); }
      el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const k = b.dataset.k, v = JSON.parse(b.dataset.v);
        if (b.dataset.multi) { const a = A[k]; const j = a.indexOf(v); if (j >= 0) a.splice(j, 1); else a.push(v); b.classList.toggle('sel'); return; }
        A[k] = v;
        if (k === 'lang') { LANG = v; LS.set(K('lang'), v); }
        el.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
        setTimeout(next, 220);
      });
      const wb = el.querySelector('#wb'); if (wb) wb.onclick = () => { i--; paint(); };
      const wn = el.querySelector('#wn'); if (wn) wn.onclick = next;
    }
    async function next() {
      const s = steps[i];
      if (s.get) {
        const inp = el.querySelector('#wv');
        if (!s.get(inp ? inp.value : '')) { const t = el.querySelector('.wz-input,.amtwrap,.opts'); if (t) { t.style.outline = '3px solid var(--pink)'; t.style.borderRadius = '20px'; } return; }
      }
      if (!s.final) { i++; paint(); return; }
      // save
      const cats = TYPE_CATS[A.type || 'other'].map(k => CAT_LIB[k]);
      A.bills.forEach(k => { if (!cats.find(c => c.k === k)) cats.splice(cats.length - 1, 0, CAT_LIB[k]); });
      cats.push(CAT_LIB.utang_in, CAT_LIB.utang_out);
      let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { }
      const settings = { lang: A.lang, businessName: A.businessName, ownerName: A.ownerName, bizType: A.type, currency: A.currency, methods: A.methods, startCash: num(A.startCash), utangOn: A.utangOn, categories: cats, staffEdit: A.staffEdit, tz };
      const btn = el.querySelector('#wn'); btn.disabled = true; btn.textContent = L('Sine-save…', 'Saving…');
      try {
        const h = await pinHash(A.pin);
        LS.set(K('pin'), h);
        const j = await api('setup', { settings, by: A.ownerName, pinHash: h });
        applyServer(j); await saveCache();
        LS.set(K('name'), A.ownerName); LS.set(K('owner'), true);
        el.remove(); resolve();
      } catch (e) {
        btn.disabled = false; btn.textContent = L('Subukan ulit', 'Try again');
        toast(L('Kailangan ng internet para i-save. Subukan ulit.', 'Need internet to save. Please try again.'), 'sad');
      }
    }
    paint();
  });
}

/* ---------- "Who are you?" (once per phone) ---------- */
function askName(change) {
  return new Promise(resolve => {
    const el = screen(
      '<div class="wz-m">' + mascot('wave', 'hop') + '</div><div class="wz-q">' + L('Hello! Sino ka? 👋', 'Hi! Who are you? 👋') +
      '<small>' + L('Para makita ng lahat kung sino ang naglista o nag-edit.', 'So everyone can see who recorded or changed things.') + '</small></div>' +
      '<input class="wz-input" id="nm" value="' + esc(change ? myName() : '') + '" placeholder="' + L('Pangalan mo (hal. Joy)', 'Your name (e.g. Joy)') + '">' +
      '<div class="chips" style="justify-content:center;margin-top:12px">' + ['Owner', 'Staff', 'Cashier'].map(x => '<button class="chip" data-n="' + x + '">' + x + '</button>').join('') + '</div>' +
      '<div class="wz-foot"><button class="btn main" id="nm-ok">' + L('Sige, tuloy! →', 'Continue →') + '</button></div>');
    const i = el.querySelector('#nm'); setTimeout(() => i.focus(), 250);
    el.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { i.value = i.value ? i.value.replace(/ \((Owner|Staff|Cashier)\)$/, '') + ' (' + b.dataset.n + ')' : b.dataset.n; i.focus(); });
    const ok = () => { const v = i.value.trim(); if (!v) { i.style.borderColor = 'var(--pink)'; return; } LS.set(K('name'), v); carryParams(); el.remove(); resolve(); };
    el.querySelector('#nm-ok').onclick = ok;
    i.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  });
}

/* ---------- guided tour: only the highlighted button can be tapped ---------- */
let tourActive = false;
function tourSteps(kind) {
  const full = [
    { sel: '#c-in', tl: 'Dito makikita ang <b>Kita</b> — perang pumasok mula sa benta.', en: 'This shows your <b>Money In</b> — cash from sales.' },
    { sel: '#c-out', tl: 'Ito ang <b>Gastos</b> — perang lumabas (paninda, pamasahe, bills).', en: 'These are your <b>Expenses</b> — money going out (stock, transport, bills).' },
    { sel: '#c-profit', tl: 'Ito ang <b>Tubo</b>. Kita bawas Gastos. Ako na ang nagkukuwenta! 🐃', en: 'This is your <b>Profit</b>: Money In minus Expenses. I do the math! 🐃' },
    { sel: '#cash-box', tl: 'Tantiya ng perang hawak mo ngayon.', en: 'An estimate of the cash you have right now.' },
    { sel: '#tools', tl: 'Dito ang <b>Calculator</b>, <b>Presyo calculator</b> (para malaman ang tamang presyo), at <b>Tulong</b> kung may tanong ka.', en: 'Here are the <b>Calculator</b>, the <b>Price calculator</b> (to find the right price), and <b>Help</b> if you have questions.' },
    { sel: '#fab', action: 1, tl: 'Subukan natin! Pindutin ang <b>+</b> para maglista.', en: "Let's try it! Tap <b>+</b> to record something." },
    { sel: '#sh-type', tl: 'Piliin muna: <b>Kita</b> kung may pumasok na pera, <b>Gastos</b> kung may lumabas.', en: 'First choose: <b>Money In</b> for cash received, <b>Expense</b> for cash spent.' },
    { sel: '#sh-amt', tl: 'I-type dito ang halaga.', en: 'Type the amount here.' },
    { sel: '#sh-cats', tl: 'Piliin kung para saan ito.', en: 'Pick what it was for.' },
    { sel: '#sh-rcpt', tl: 'Pwede kang magkuha ng picture ng resibo. Kahit malaki ang photo, ok lang!', en: 'You can snap the receipt. Big photos are fine!' },
    { sel: '#sh-close', action: 1, tl: 'Ayan! Pindutin ang <b>×</b> para isara muna.', en: 'Great! Tap <b>×</b> to close it for now.' },
    { sel: '#nav-list', tl: 'Sa <b>Listahan</b> makikita lahat ng nailista, at kung sino ang naglista.', en: '<b>Records</b> shows everything recorded, and who recorded it.' },
    { sel: '#nav-utang', tl: 'Sa <b>Utang</b> ililista kung sino ang may utang sa iyo, at utang mo.', en: '<b>Credit</b> tracks who owes you, and who you owe.', skipIf: () => !S.settings.utangOn },
    { sel: '#nav-report', tl: 'Sa <b>Ulat</b> makikita ang buwanang kita, halaga ng negosyo, at buwis — pwedeng i-download sa Excel o PDF. Ikaw lang ang nakakakita nito.', en: '<b>Reports</b> shows monthly results, business worth and tax — downloadable as Excel or PDF. Only you can see it.', skipIf: () => !isOwner() },
    { sel: '#nav-help', tl: 'May tanong? Pindutin ang <b>Tulong</b> at i-type ang salita.', en: 'Questions? Tap <b>Help</b> and type a word.', skipIf: () => isOwner() },
    { sel: '#syncBadge', tl: 'Kahit walang internet, naka-save sa phone. Kusa itong magsi-sync mamaya.', en: 'No internet? It saves on the phone and syncs by itself later.' },
    { sel: '#btn-bell', tl: '🔔 Dito ka aabisuhan kapag may in-edit o binura ang staff.', en: '🔔 You get notified here when staff edit or delete something.', skipIf: () => !isOwner() },
    { sel: '#btn-settings', tl: 'Sa Settings: palitan ang wika, currency, ang patakaran sa staff, o <b>ulitin ang tutorial</b>.', en: 'Settings: change language, currency, staff rules, or <b>replay this tutorial</b>.' }
  ];
  if (kind === 'full') return full;
  return full.filter(s => ['#tools', '#fab', '#sh-type', '#sh-rcpt', '#sh-close', '#nav-list', '#nav-help'].includes(s.sel)).map(s => s.sel === '#fab' ? Object.assign({}, s, { tl: 'Ganito maglista: pindutin ang <b>+</b>.', en: 'Here\'s how to record: tap <b>+</b>.' }) : s);
}
function runTour(kind) {
  return new Promise(resolve => {
    const steps = tourSteps(kind).filter(s => !(s.skipIf && s.skipIf()));
    let i = 0, target = null, actionHandler = null;
    tourActive = true;
    const blks = [0, 1, 2, 3, 4].map(() => { const b = document.createElement('div'); b.className = 'blk'; document.body.appendChild(b); return b; });
    const ring = document.createElement('div'); ring.className = 'ring';
    const coach = document.createElement('div'); coach.className = 'coach';
    const arrow = document.createElement('div'); arrow.className = 'tap-arrow'; arrow.textContent = '👇';
    document.body.append(ring, coach, arrow);
    const blockTap = ev => { ev.preventDefault(); ev.stopPropagation(); };
    blks.forEach(b => { b.addEventListener('click', blockTap, true); b.addEventListener('touchstart', blockTap, { passive: false }); });
    const end = () => {
      tourActive = false;
      blks.forEach(b => b.remove()); ring.remove(); coach.remove(); arrow.remove();
      window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
      if (target && actionHandler) target.removeEventListener('click', actionHandler, true);
      closeSheet(true);
      LS.set(K('tour'), true); carryParams();
      toast(L('Handa ka na, Bossing! Good luck sa negosyo! 🎉', "You're all set! Good luck with the business! 🎉"), 'cheer');
      resolve();
    };
    function place() {
      if (!target) return;
      const r = target.getBoundingClientRect(), p = 6;
      const x = Math.max(0, r.left - p), y = Math.max(0, r.top - p), w = Math.min(innerWidth, r.width + p * 2), h = r.height + p * 2;
      const vw = innerWidth, vh = innerHeight;
      Object.assign(ring.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      Object.assign(blks[0].style, { left: 0, top: 0, width: vw + 'px', height: y + 'px' });
      Object.assign(blks[1].style, { left: 0, top: (y + h) + 'px', width: vw + 'px', height: Math.max(0, vh - y - h) + 'px' });
      Object.assign(blks[2].style, { left: 0, top: y + 'px', width: x + 'px', height: h + 'px' });
      Object.assign(blks[3].style, { left: (x + w) + 'px', top: y + 'px', width: Math.max(0, vw - x - w) + 'px', height: h + 'px' });
      // 5th blocker covers the hole on "info" steps so nothing can be pressed except Next
      const s = steps[i];
      Object.assign(blks[4].style, s.action ? { width: 0, height: 0 } : { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      const ch = coach.offsetHeight || 120;
      const below = y + h + 16 + ch < vh - 10;
      const above = y - ch - 16 > 10;
      let top;
      if (y + h / 2 > vh / 2 && above) top = y - ch - 50; else if (below) top = y + h + 50; else top = Math.max(10, y - ch - 50);
      top = Math.max(10 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safet')) || 0), Math.min(top, vh - ch - 10));
      coach.style.top = top + 'px';
      arrow.style.display = s.action ? 'block' : 'none';
      const pointDown = top < y;
      arrow.textContent = pointDown ? '👇' : '👆';
      arrow.style.left = Math.min(vw - 50, Math.max(4, x + w / 2 - 20)) + 'px';
      arrow.style.top = (pointDown ? y - 44 : y + h + 2) + 'px';
    }
    function show() {
      if (target && actionHandler) { target.removeEventListener('click', actionHandler, true); actionHandler = null; }
      if (i >= steps.length) return end();
      const s = steps[i];
      let tries = 0;
      const find = () => {
        target = document.querySelector(s.sel);
        if (!target || target.offsetParent === null && getComputedStyle(target).position !== 'fixed') {
          if (tries++ < 20) return setTimeout(find, 80);
          i++; return show(); // element not on screen — skip
        }
        const r = target.getBoundingClientRect();
        if (r.top < 70 || r.bottom > innerHeight - 90) { target.scrollIntoView({ block: 'center', behavior: 'instant' }); }
        coach.innerHTML = '<div class="m">' + mascot(s.action ? 'wave' : 'happy') + '</div><div style="flex:1"><div class="stepn">' + (i + 1) + ' / ' + steps.length + '</div><div class="txt">' + s[LANG] + '</div><div class="act">' +
          (s.action ? '<span class="small b muted">👆 ' + L('Pindutin ang nakailaw', 'Tap the highlighted button') + '</span>' : '<button class="go">' + (i === steps.length - 1 ? L('Tapos! 🎉', 'Done! 🎉') : L('Sige →', 'Next →')) + '</button>') +
          '<button class="skip">' + L('Laktawan', 'Skip') + '</button></div></div>';
        const go = coach.querySelector('.go'); if (go) go.onclick = () => { i++; show(); };
        coach.querySelector('.skip').onclick = end;
        if (s.action) {
          actionHandler = () => { target.removeEventListener('click', actionHandler, true); actionHandler = null; setTimeout(() => { i++; show(); }, 380); };
          target.addEventListener('click', actionHandler, true);
        }
        requestAnimationFrame(place); setTimeout(place, 300);
      };
      find();
    }
    window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
    show();
  });
}

/* ---------- gates: wrong link / ended / need internet ---------- */
let gateEl = null;
function gate(mood, title, msg, btn) {
  if (gateEl) gateEl.remove();
  gateEl = screen('<div style="flex:1"></div><div class="wz-m">' + mascot(mood) + '</div><div class="wz-q">' + title + '<small>' + msg + '</small></div>' + (btn ? '<button class="btn main" id="g-btn">' + btn + '</button>' : '') + '<div style="flex:1"></div>');
  gateEl.style.zIndex = 150;
  const b = gateEl.querySelector('#g-btn'); if (b) b.onclick = () => location.reload();
}
function gateCheck() {
  if (!S.sub) return false;
  if (S.sub.state === 'invalid') { gate('sad', L('Hindi gumagana ang link na ito', "This link doesn't work"), L('Baka luma na ang link. Humingi ng bagong Kwentoink link sa owner ng negosyo.', 'It may be an old link. Ask the business owner for the new Kwentoink link.')); return true; }
  if (S.sub.state === 'expired') { gate('sad', L('Naka-pause ang Kwentoink mo', 'Your Kwentoink is paused'), L('Tapos na ang trial o subscription. Ligtas ang lahat ng listahan mo! 💙<br><br>', 'Your trial or subscription has ended. All your records are safe! 💙<br><br>') + esc(S.support), L('Subukan ulit', 'Check again')); return true; }
  if (gateEl) { gateEl.remove(); gateEl = null; }
  return false;
}

/* =================================================================
   BOOT
   ================================================================= */
async function boot() {
  const hideSplash = () => { const sp = $('#splash'); if (sp) { sp.style.opacity = 0; setTimeout(() => sp.remove(), 300); } };
  if (DEMO) $('#demoChip').classList.remove('hidden');
  if (!CODE) { hideSplash(); gate('think', L('Kailangan ang link mo', 'You need your personal link'), L('Buksan ang Kwentoink gamit ang link na ibinigay sa iyo.', 'Open Kwentoink using the link you were given.')); return; }
  readCarried();
  const hadCache = await loadCache();
  if (S.settings && !LS.get(K('lang'), null) && S.settings.lang) LANG = S.settings.lang;
  document.documentElement.lang = LANG === 'tl' ? 'tl' : 'en';
  if (hadCache && S.settings) { showApp(); hideSplash(); }

  // talk to the server (in the background if we already showed cached data)
  let fresh = false;
  if (navigator.onLine || DEMO) {
    try {
      const j = S.ops.length ? await api('sync', { ops: S.ops, pin: pinKey() }) : await api('init', { pin: pinKey() });
      if (S.ops.length) { S.ops = []; DB.set(K('ops'), S.ops); }
      applyServer(j); await saveCache(); fresh = true;
    } catch (e) { console.warn(e); }
  }
  if (S.settings && !LS.get(K('lang'), null) && S.settings.lang) LANG = S.settings.lang;
  hideSplash();
  if (gateCheck()) return;
  if (!S.settings && !fresh) {
    gate('think', L('Kailangan ng internet', 'Internet needed'), L('Sa unang bukas, kailangan ng internet. Pagkatapos nito, gagana na kahit offline!', 'The very first time needs internet. After that it works offline too!'), L('Subukan ulit', 'Try again'));
    return;
  }
  if (!fresh && S.lastOk && Date.now() - S.lastOk > S.grace * 86400000) {
    gate('think', L('Kumonekta sa internet', 'Please connect to the internet'), L('Matagal ka nang offline. Kumonekta saglit para ma-sync at ma-check ang account mo.', "You've been offline a long time. Connect briefly to sync and check your account."), L('Subukan ulit', 'Try again'));
    return;
  }
  // first-time on this phone
  if (needInstallGuide()) await installGuide(false);
  if (!S.settings) await setupWizard();
  if (!myName()) await askName(false);
  carryParams();
  // businesses set up before the PIN feature: ask the owner's phone to create one
  if (S.pinSet === false && isOwnerDevice() && (navigator.onLine || DEMO)) { showApp(); await createPinFlow(true); }
  showApp();
  if (!LS.get(K('tour'), false)) { go('home'); await new Promise(r => setTimeout(r, 400)); await runTour(isOwner() || isOwnerDevice() ? 'full' : 'short'); }
  flush(); loadLog();
}
let appShown = false;
function showApp() {
  $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  if (!appShown) {
    appShown = true;
    $$('.nav button[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
    $('#fab').onclick = () => openEntry();
    $('#btn-settings').onclick = () => go('settings');
    $('#btn-bell').onclick = () => go('alerts');
    $('#syncBadge').onclick = () => { flush(true); };
  }
  go(S.view || 'home');
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
boot();
</script>
